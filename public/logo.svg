<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Puzzle/Block Shape -->
  <rect x="10" y="10" width="80" height="80" rx="18" fill="url(#cGrad)" filter="url(#shadow)"/>
  
  <!-- Block Notch Top -->
  <path d="M 38 10 C 38 6, 44 4, 50 4 C 56 4, 62 6, 62 10 Z" fill="#60a5fa"/>
  
  <!-- Visual Code Brackets & C -->
  <path d="M 68 35 C 62 26, 44 26, 38 35 C 30 45, 30 55, 38 65 C 44 74, 62 74, 68 65" 
        fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
  
  <!-- Plus plus badges representing visual blocks -->
  <circle cx="75" cy="40" r="4.5" fill="#38bdf8"/>
  <circle cx="75" cy="60" r="4.5" fill="#38bdf8"/>
</svg>
